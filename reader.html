<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 検索エンジンに載せない（完全な非公開ではありません） -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>書架 | 光の届かぬ庭で、ティータイムを</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== 色とかたち ===== */
:root{
  --night:#151a16;      /* 光の届かぬ庭 */
  --moss:#232b24;       /* 苔むした壁 */
  --linen:#ebe3d4;      /* 包帯／紙 */
  --linen-dim:#b9b0a0;
  --rose:#b48a8c;       /* 色褪せた薔薇 */
  --candle:#cfae6e;     /* 燭台の灯 */
  --ink:#2a2420;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--night);
  background-image:radial-gradient(ellipse 60% 50% at 50% 42%, #2a2a20 0%, transparent 70%);
  color:var(--linen);font-family:var(--serif);
  overflow:hidden;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--candle);outline-offset:3px}

/* ===== 表紙（書架）画面 ===== */
#shelf{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;padding:2rem 1.5rem;overflow-y:auto}
.book{
  position:relative;width:min(62vw,280px);aspect-ratio:707/1000;
  background:var(--moss);border-radius:2px 6px 6px 2px;
  box-shadow:inset 10px 0 18px -8px rgba(0,0,0,.6), 0 30px 60px -20px rgba(0,0,0,.8), 0 0 80px -10px rgba(207,174,110,.18);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.book img{width:100%;height:100%;object-fit:cover}
.book .cover-text{writing-mode:vertical-rl;font-size:1.35rem;font-weight:600;letter-spacing:.35em;line-height:2.2;color:var(--linen)}
.book::after{content:"";position:absolute;inset:0;border:1px solid rgba(207,174,110,.35);margin:10px;pointer-events:none}
.shelf-title{font-size:.9rem;letter-spacing:.3em;color:var(--linen-dim);margin:0}
.shelf-actions{display:flex;flex-direction:column;align-items:center;gap:.9rem}
.btn-open{
  padding:.85rem 2.6rem;border:1px solid var(--candle);color:var(--candle);
  letter-spacing:.25em;font-size:1rem;transition:background .3s,color .3s;
}
.btn-open:hover{background:var(--candle);color:var(--night)}
.resume{font-size:.82rem;color:var(--linen-dim);text-decoration:underline;text-underline-offset:4px}
.ep-list{list-style:none;margin:0;padding:0;width:min(100%,320px)}
.ep-list li button{width:100%;display:flex;justify-content:space-between;gap:1rem;padding:.8rem .2rem;border-bottom:1px solid rgba(235,227,212,.12);text-align:left;font-size:.95rem}
.ep-list li button span:last-child{color:var(--linen-dim);font-size:.8rem;white-space:nowrap}
.back-site{font-size:.8rem;color:var(--linen-dim);text-decoration:none;letter-spacing:.1em}

/* ===== 読書画面 ===== */
#reader{position:absolute;inset:0;display:none}
#reader.on{display:block}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:3.2rem .5rem 3.6rem}
.spread{display:flex;flex-direction:row-reverse;height:100%;max-width:100%;align-items:center;justify-content:center}
.page{
  position:relative;height:100%;max-height:100%;aspect-ratio:707/1000;max-width:100%;
  background:var(--linen);overflow:hidden;
}
.page img{width:100%;height:100%;object-fit:contain;display:block;background:var(--linen)}
/* 見開き：のど（綴じ目）の影 */
.spread.two .page{max-width:50%}
.spread.two .page:first-child{box-shadow:inset 22px 0 26px -18px rgba(0,0,0,.45)}   /* 右ページ */
.spread.two .page:last-child{box-shadow:inset -22px 0 26px -18px rgba(0,0,0,.45)}   /* 左ページ */
.spread{filter:drop-shadow(0 24px 40px rgba(0,0,0,.6))}
.spread.turn-next{animation:turnNext .38s ease}
.spread.turn-prev{animation:turnPrev .38s ease}
@keyframes turnNext{from{opacity:.2;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes turnPrev{from{opacity:.2;transform:translateX(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.spread.turn-next,.spread.turn-prev{animation:none}}

/* タップ領域（右開き：左をタップで次へ） */
.tap{position:absolute;top:0;bottom:0;z-index:2}
.tap.next{left:0;width:35%}
.tap.mid{left:35%;width:30%}
.tap.prev{right:0;width:35%}

/* 上下のバー */
.bar{position:fixed;left:0;right:0;z-index:5;display:flex;align-items:center;gap:1rem;padding:0 1rem;
  background:linear-gradient(var(--night),rgba(21,26,22,.85));transition:opacity .3s,transform .3s}
.bar.top{top:0;padding-top:env(safe-area-inset-top,0px);height:calc(3rem + env(safe-area-inset-top,0px));justify-content:space-between}
.bar.bottom{bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(3.4rem + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(21,26,22,.85),var(--night))}
.hide-ui .bar.top{opacity:0;transform:translateY(-100%);pointer-events:none}
.hide-ui .bar.bottom{opacity:0;transform:translateY(100%);pointer-events:none}
.ep-name{font-size:.88rem;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{font-size:.85rem;letter-spacing:.1em;color:var(--linen-dim);padding:.5rem .2rem;white-space:nowrap}
.bar button:hover{color:var(--candle)}
input[type=range]{flex:1;direction:rtl;accent-color:var(--candle)}
.pno{font-size:.8rem;color:var(--linen-dim);min-width:5.5em;text-align:right;font-variant-numeric:tabular-nums}

/* 目次 */
.toc{position:fixed;inset:0;z-index:10;display:none;background:rgba(10,12,10,.7)}
.toc.on{display:block}
.toc-panel{position:absolute;right:0;top:0;bottom:0;width:min(86vw,340px);background:var(--moss);padding:calc(1.5rem + env(safe-area-inset-top,0px)) 1.4rem 1.5rem;overflow-y:auto;box-shadow:-20px 0 40px rgba(0,0,0,.5)}
.toc h2{font-size:1rem;letter-spacing:.3em;font-weight:600;margin:0 0 1rem;color:var(--candle)}
.toc .ep-list li button[aria-current="true"]{color:var(--candle)}

.toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:8;background:rgba(35,43,36,.95);border:1px solid rgba(207,174,110,.4);padding:1rem 1.6rem;font-size:.95rem;letter-spacing:.15em;opacity:0;pointer-events:none;transition:opacity .4s}
.toast.on{opacity:1}
</style>
</head>
<body>

<!-- ===== 書架 ===== -->
<section id="shelf" aria-label="書架">
  <div class="book" id="coverBox">
    <span class="cover-text">光の届かぬ庭で、<br>ティータイムを</span>
  </div>
  <div class="shelf-actions">
    <button class="btn-open" id="openBtn">頁をひらく</button>
    <button class="resume" id="resumeBtn" hidden></button>
  </div>
  <ul class="ep-list" id="shelfList"></ul>
  <a class="back-site" href="index.html">表紙へ戻る</a>
</section>

<!-- ===== 読書画面 ===== -->
<section id="reader" aria-label="漫画を読む">
  <header class="bar top">
    <button id="closeBtn">書架へ</button>
    <span class="ep-name" id="epName"></span>
    <button id="tocBtn">目次</button>
  </header>

  <div class="stage">
    <div class="spread" id="spread"></div>
  </div>
  <button class="tap next" id="tapNext" aria-label="次のページ"></button>
  <button class="tap mid" id="tapMid" aria-label="メニューの表示切替"></button>
  <button class="tap prev" id="tapPrev" aria-label="前のページ"></button>

  <footer class="bar bottom">
    <span class="pno" id="pno"></span>
    <input type="range" id="slider" min="0" value="0" aria-label="ページ位置">
  </footer>
</section>

<div class="toc" id="toc">
  <nav class="toc-panel" aria-label="目次">
    <h2>目次</h2>
    <ul class="ep-list" id="tocList"></ul>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* 目次と画像の一覧は、書斎（post.html）から保存すると
   manga/index.json に自動で書き込まれます。手で編集する必要はありません。
   まだ何もない時は、仮ページで動作確認できます。 */
let BOOK = { cover: "", episodes: [
  { title: "見本　第一話", pages: [], dummy: 14 },
  { title: "見本　第二話", pages: [], dummy: 10 },
]};

const KEY = "hikari-garden-reader";
const $ = id => document.getElementById(id);
let ep = 0, view = 0, views = [], twoUp = false;

// 仮ページ（SVG）
function dummyPage(e, n){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 707 1000'>
  <rect width='707' height='1000' fill='#ebe3d4'/>
  <g fill='none' stroke='#2a2420' stroke-opacity='.55' stroke-width='3'>
    <rect x='40' y='40' width='627' height='300'/>
    <rect x='40' y='360' width='300' height='280'/><rect x='360' y='360' width='307' height='280'/>
    <rect x='40' y='660' width='627' height='300'/>
  </g>
  <text x='353' y='520' text-anchor='middle' font-family='serif' font-size='40' fill='#2a2420' fill-opacity='.45'>第${e+1}話　${n}頁</text>
  </svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function pagesOf(e){
  const E = BOOK.episodes[e];
  return E.pages.length ? E.pages.map(x=>x+(E.v?`?v=${E.v}`:"")) : Array.from({length:E.dummy||8},(_,i)=>dummyPage(e,i+1));
}
function buildViews(){
  const n = pagesOf(ep).length; views = [[0]];
  if(twoUp){ for(let i=1;i<n;i+=2) views.push(i+1<n?[i,i+1]:[i]); }
  else { for(let i=1;i<n;i++) views.push([i]); }
}
function viewOfPage(p){ return Math.max(0, views.findIndex(v=>v.includes(p))); }

function render(dir){
  const pages = pagesOf(ep), v = views[view], s = $("spread");
  s.className = "spread" + (v.length===2?" two":"");
  s.innerHTML = v.map(i=>`<div class="page"><img src="${pages[i]}" alt="第${ep+1}話 ${i+1}ページ" decoding="async"></div>`).join("");
  if(dir){ void s.offsetWidth; s.classList.add(dir>0?"turn-next":"turn-prev"); }
  $("epName").textContent = BOOK.episodes[ep].title;
  const last = v[v.length-1]+1;
  $("pno").textContent = (v.length===2?`${v[0]+1}-${last}`:`${last}`) + " / " + pages.length;
  $("slider").max = views.length-1; $("slider").value = view;
  // 次の見開きを先読み
  (views[view+1]||[]).forEach(i=>{ const im=new Image(); im.src=pages[i]; });
  save();
}
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),1500); }

function go(d){
  if(d>0){
    if(view<views.length-1){ view++; render(1); }
    else if(ep<BOOK.episodes.length-1){ ep++; buildViews(); view=0; render(1); toast(BOOK.episodes[ep].title); }
    else toast("ここで物語はおしまい");
  }else{
    if(view>0){ view--; render(-1); }
    else if(ep>0){ ep--; buildViews(); view=views.length-1; render(-1); toast(BOOK.episodes[ep].title); }
  }
}
function openEp(e, page){
  ep=e; buildViews(); view = page?viewOfPage(page):0;
  $("shelf").style.display="none"; $("reader").classList.add("on"); $("toc").classList.remove("on");
  render(); $("tapMid").focus({preventScroll:true});
}
function closeReader(){ $("reader").classList.remove("on"); $("shelf").style.display=""; refreshShelf(); }

// 続きから（ブラウザに保存）
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({ep, page:views[view][0]})); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }

function listHTML(cur){
  return BOOK.episodes.map((E,i)=>`<li><button data-ep="${i}" ${cur===i?'aria-current="true"':''}><span>${E.title}</span><span>${pagesOf(i).length}頁</span></button></li>`).join("");
}
function refreshShelf(){
  $("shelfList").innerHTML = listHTML(-1);
  const s = load(); const r = $("resumeBtn");
  if(s && BOOK.episodes[s.ep]){ r.hidden=false; r.textContent=`続きから（${BOOK.episodes[s.ep].title}　${s.page+1}頁）`; r.onclick=()=>openEp(s.ep,s.page); }
  else r.hidden=true;
}

// レイアウト判定：横長の画面は見開き
function checkLayout(){
  const want = window.innerWidth >= 820 && window.innerWidth > window.innerHeight;
  if(want!==twoUp){
    const keep = views.length ? views[view][0] : 0;
    twoUp = want;
    if($("reader").classList.contains("on")){ buildViews(); view=viewOfPage(keep); render(); }
  }
}

// ===== 操作 =====
$("openBtn").onclick = ()=>openEp(0);
$("closeBtn").onclick = closeReader;
$("tapNext").onclick = ()=>go(1);
$("tapPrev").onclick = ()=>go(-1);
$("tapMid").onclick = ()=>$("reader").classList.toggle("hide-ui");
$("slider").oninput = e=>{ view=+e.target.value; render(); };
$("tocBtn").onclick = ()=>{ $("tocList").innerHTML=listHTML(ep); $("toc").classList.add("on"); };
$("toc").onclick = e=>{ if(e.target.id==="toc") $("toc").classList.remove("on"); };
document.addEventListener("click", e=>{ const b=e.target.closest("[data-ep]"); if(b) openEp(+b.dataset.ep); });
document.addEventListener("keydown", e=>{
  if(!$("reader").classList.contains("on")) return;
  if(e.key==="ArrowLeft"||e.key===" ") { e.preventDefault(); go(1); }
  if(e.key==="ArrowRight") go(-1);
  if(e.key==="Escape") $("toc").classList.contains("on") ? $("toc").classList.remove("on") : closeReader();
});
// スワイプ（右開き：指を右へ払うと次へ）
let sx=null;
$("reader").addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; },{passive:true});
$("reader").addEventListener("touchend",e=>{
  if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)>50) go(dx>0?1:-1);
});
window.addEventListener("resize", checkLayout);

// 初期化
(async()=>{
  try{
    const r = await fetch(`manga/index.json?t=${Date.now()}`);
    if(r.ok){ const d = await r.json(); if(d.episodes && d.episodes.length) BOOK = d; else if(d.cover) BOOK.cover = d.cover, BOOK.coverV = d.coverV; }
  }catch(e){}
  if(BOOK.cover){ $("coverBox").innerHTML = `<img src="${BOOK.cover}${BOOK.coverV?`?v=${BOOK.coverV}`:""}" alt="表紙">`; }
  checkLayout(); refreshShelf();
})();
</script>
</body>
</html>
