<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小説を読む | 光の届かぬ庭で、ティータイムを</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1E1B24; --moss:#2A2630; --linen:#F6F2F7; --linen-dim:#B8B0C4;
  --rose:#8E80A8; --candle:#D6C8F0; --ink:#2E2538;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Noto Serif JP","Yu Mincho","YuMincho",serif;
  --fs:18px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--night);background-image:radial-gradient(ellipse 60% 50% at 50% 40%,#332C40 0%,transparent 70%);color:#E8E2EE;font-family:var(--serif);overflow:hidden}
button,a{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--candle);outline-offset:3px}

/* 目次画面 */
#shelf{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:3.5rem 1.5rem 3rem;gap:2rem}
.title-v{writing-mode:vertical-rl;font-size:1.6rem;font-weight:600;letter-spacing:.35em;line-height:2.2;margin:0;height:13em}
.lead{font-size:.85rem;letter-spacing:.25em;color:var(--linen-dim);margin:0}
.ep-list{list-style:none;margin:0;padding:0;width:min(100%,360px)}
.ep-list button{width:100%;display:flex;gap:1rem;padding:.9rem .2rem;border-bottom:1px solid rgba(232,226,238,.12);text-align:left;font-size:.98rem}
.ep-list button:hover{color:var(--candle)}
.ep-list .no{color:var(--candle);min-width:3.2em;font-size:.85rem;padding-top:.15em}
.resume{padding:.8rem 2rem;border:1px solid var(--candle);color:var(--candle);letter-spacing:.2em}
.resume:hover{background:var(--candle);color:var(--night)}
.empty,.err{color:var(--linen-dim);font-size:.9rem;text-align:center;line-height:2}
.foot{display:flex;gap:1.5rem;font-size:.8rem;letter-spacing:.1em}
.foot a{color:var(--linen-dim);text-decoration:none}

/* 読書画面 */
#reader{position:absolute;inset:0;display:none}
#reader.on{display:block}
.bar{position:fixed;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:0 1rem;transition:opacity .3s,transform .3s}
.bar.top{top:0;padding-top:env(safe-area-inset-top,0px);height:calc(3rem + env(safe-area-inset-top,0px));background:linear-gradient(var(--night),rgba(30,27,36,.92))}
.bar.bottom{bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(3.2rem + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(30,27,36,.92),var(--night))}
.hide-ui .bar.top{opacity:0;transform:translateY(-100%);pointer-events:none}
.hide-ui .bar.bottom{opacity:0;transform:translateY(100%);pointer-events:none}
.bar button{font-size:.85rem;letter-spacing:.1em;color:var(--linen-dim);padding:.5rem .2rem;white-space:nowrap}
.bar button:hover,.bar button[aria-pressed="true"]{color:var(--candle)}
.ep-name{font-size:.88rem;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{font-size:.78rem;color:var(--linen-dim);font-variant-numeric:tabular-nums;min-width:5.5em;text-align:right}
input[type=range]{flex:1;accent-color:var(--candle)}
.v input[type=range]{direction:rtl}

/* 紙面：1ページずつめくる */
.paper{position:absolute;top:calc(env(safe-area-inset-top,0px) + .5rem);bottom:calc(env(safe-area-inset-bottom,0px) + .5rem);left:.5rem;right:.5rem;
  background:var(--linen);color:var(--ink);overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.8),0 0 90px -20px rgba(214,200,240,.2)}
.vp{position:absolute;overflow:hidden}
.flow{position:absolute;top:0;font-size:var(--fs);letter-spacing:.04em;line-height:var(--lh);}
/* ページをめくる演出 */
.v .vp.turn-next,.h .vp.turn-prev{animation:inL .3s ease}
.v .vp.turn-prev,.h .vp.turn-next{animation:inR .3s ease}
@keyframes inL{from{opacity:.15;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:.15;transform:translateX(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.vp.turn-next,.vp.turn-prev{animation:none}}
.v .flow{writing-mode:vertical-rl;right:0;column-fill:auto}
.h .flow{writing-mode:horizontal-tb;left:0;column-fill:auto}
.flow h1{font-size:1.15em;font-weight:600;letter-spacing:.2em;margin:0;line-height:calc(var(--lh) * 2)}
.flow p{margin:0;text-indent:1em}
.flow p.blank::before{content:"\3000"}
.flow p.break{text-indent:0;text-align:center;color:var(--rose);letter-spacing:.6em}
.flow p.talk{text-indent:0}
.bt{font-style:normal;-webkit-text-emphasis:filled sesame;text-emphasis:filled sesame}
.h .bt{-webkit-text-emphasis-position:over right;text-emphasis-position:over right}
.tcy{-webkit-text-combine:horizontal;text-combine-upright:all}
rt{font-size:.5em;letter-spacing:0}
.end{text-indent:0;display:flex;gap:1.2em;align-items:flex-start}
.end button{border:1px solid var(--ink);color:var(--ink);padding:.5em .8em;font-size:.85em;letter-spacing:.2em;position:relative;z-index:4}
.end button:hover{background:var(--ink);color:var(--linen)}
.end .fin{color:var(--rose);letter-spacing:.4em;font-size:.9em}
/* 挿絵：1ページまるごと使って表示 */
.flow figure.illust{margin:0;width:var(--pw);height:var(--ph);display:flex;align-items:center;justify-content:center;text-indent:0;
  break-before:column;break-after:column;-webkit-column-break-before:always;-webkit-column-break-after:always;break-inside:avoid}
.flow figure.illust img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;box-shadow:0 6px 18px rgba(46,37,56,.18)}
.folio{position:absolute;left:0;right:0;bottom:.7rem;text-align:center;font-size:.72rem;color:var(--rose);letter-spacing:.1em;font-variant-numeric:tabular-nums;pointer-events:none}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--rose);font-size:.9rem;line-height:2;padding:2rem}

/* タップ領域（縦書き：左で次へ／横書き：右で次へ） */
.tap{position:absolute;top:0;bottom:0;z-index:3;background:none;border:0;-webkit-tap-highlight-color:transparent}
.tap.left{left:0;width:30%} .tap.mid{left:30%;width:40%} .tap.right{right:0;width:30%}

/* 設定 */
.panel{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--moss);padding:1.2rem 1.4rem calc(1.4rem + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;gap:1rem;box-shadow:0 -20px 40px rgba(0,0,0,.5)}
.panel.on{display:flex}
.row{display:flex;align-items:center;justify-content:space-between;gap:1rem;font-size:.9rem}
.seg{display:flex;border:1px solid rgba(214,200,240,.5)}
.seg button{padding:.45rem .9rem;font-size:.85rem;color:var(--linen-dim)}
.seg button[aria-pressed="true"]{background:var(--candle);color:var(--night)}
</style>
</head>
<body>

<section id="shelf" aria-label="目次">
  <h1 class="title-v">光の届かぬ庭で、<br>ティータイムを</h1>
  <p class="lead">小説で読む</p>
  <button class="resume" id="resumeBtn" hidden>続きから読む</button>
  <ul class="ep-list" id="list"></ul>
  <div class="foot"><a href="index.html">表紙へ戻る</a><a href="reader.html">漫画で読む</a></div>
</section>

<section id="reader" class="v" aria-label="本文">
  <div class="paper" id="paper">
    <div class="vp" id="vp"><article class="flow" id="flow"></article></div>
    <div class="folio" id="folio"></div>
    <div class="msg" id="msg" hidden></div>
  </div>
  <button class="tap left" id="tapL" aria-label="左のページ"></button>
  <button class="tap mid" id="tapM" aria-label="メニューの表示切替"></button>
  <button class="tap right" id="tapR" aria-label="右のページ"></button>
  <header class="bar top">
    <button id="closeBtn">目次</button>
    <span class="ep-name" id="epName"></span>
    <button id="setBtn">文字</button>
  </header>
  <footer class="bar bottom">
    <input type="range" id="slider" min="0" value="0" aria-label="ページ位置">
    <span class="prog" id="prog"></span>
  </footer>
</section>

<div class="panel" id="panel" role="dialog" aria-label="表示設定">
  <div class="row"><span>組み方</span><div class="seg" id="segDir"><button data-v="v">縦書き</button><button data-v="h">横書き</button></div></div>
  <div class="row"><span>文字の大きさ</span><div class="seg" id="segFs"><button data-v="15">小</button><button data-v="18">中</button><button data-v="21">大</button><button data-v="24">特大</button></div></div>
  <div class="row"><span></span><button id="panelClose" style="color:var(--candle)">閉じる</button></div>
</div>

<script>
const KEY="hikari-garden-novel";
const $=id=>document.getElementById(id);
let index=[], cur=-1, page=0, total=1, step=0, swiped=false;
const pref=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})();
pref.dir=pref.dir||"v"; pref.fs=pref.fs||18;
function savePref(){try{localStorage.setItem(KEY,JSON.stringify(pref))}catch(e){}}
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ===== カクヨム・なろう記法 → HTML ===== */
function parse(src){
  return src.replace(/\r\n?/g,"\n").split("\n").map(line=>{
    if(!line.trim()) return '<p class="blank"></p>';
    const ill=line.trim().match(/^［挿絵[:：]([\w\-./]+)］$/);
    if(ill) return `<figure class="illust"><img src="${ill[1]}" alt="挿絵" loading="lazy"></figure>`;
    let t=esc(line);
    if(/^\s*[◇◆＊*※†✿❀・－―\-\s]+\s*$/.test(line)&&line.trim().length<=12) return `<p class="break">${t.trim()}</p>`;
    t=t.replace(/《《(.+?)》》/g,'<em class="bt">$1</em>');
    t=t.replace(/[|｜]([^|｜《]+?)《(.+?)》/g,'<ruby>$1<rt>$2</rt></ruby>');
    t=t.replace(/([々〆ヵヶ\u4E00-\u9FFF]+)《(.+?)》/g,'<ruby>$1<rt>$2</rt></ruby>');
    t=t.replace(/(^|[^0-9A-Za-z])([0-9]{1,2}|!!|!\?|\?!)(?![0-9A-Za-z])/g,'$1<span class="tcy">$2</span>');
    return `<p${/^[「『（(〈]/.test(line.trim())?' class="talk"':''}>${t}</p>`;
  }).join("");
}

/* ===== 目次 ===== */
async function loadIndex(){
  try{ const r=await fetch(`novel/index.json?t=${Date.now()}`); if(!r.ok) throw 0; index=(await r.json()).episodes||[]; }
  catch(e){ index=[]; }
  $("list").innerHTML = index.length
    ? index.map((e,i)=>`<li><button data-i="${i}"><span class="no">第${i+1}話</span><span>${esc(e.title)}</span></button></li>`).join("")
    : '<li class="empty">まだ話がありません。<br>投稿画面から最初の話を追加してください。</li>';
  const b=pref.mark, i=b?index.findIndex(e=>e.id===b.id):-1;
  if(i>=0){ $("resumeBtn").hidden=false; $("resumeBtn").textContent=`続きから（第${i+1}話）`; $("resumeBtn").onclick=()=>open(i,b.pos); }
}

/* ===== 本文を開く ===== */
async function open(i,pos=0){
  cur=i; const e=index[i];
  $("epName").textContent=`第${i+1}話　${e.title}`;
  $("shelf").style.display="none"; $("reader").classList.add("on"); $("reader").classList.remove("hide-ui");
  $("flow").innerHTML=""; showMsg("ひらいています…");
  try{
    const r=await fetch(`novel/${e.id}.txt?t=${Date.now()}`); if(!r.ok) throw 0;
    const txt=await r.text();
    const next = i<index.length-1 ? `<button id="nextEp">次の話へ</button>` : `<span class="fin">了</span>`;
    $("flow").innerHTML=`<h1>${esc(e.title)}</h1><p class="blank"></p>${parse(txt)}<p class="blank"></p><div class="end">${next}<button id="toList">目次へ</button></div>`;
    $("toList").onclick=close;
    if($("nextEp")) $("nextEp").onclick=()=>open(i+1);
    $("flow").querySelectorAll("img").forEach(im=>im.addEventListener("load",()=>paginate(ratio())));
    showMsg("");
  }catch(err){ showMsg("本文を読み込めませんでした。<br>ファイルがあるか確認してください。"); }
  paginate(pos);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>paginate(ratio()));
}
function showMsg(h){ $("msg").hidden=!h; $("msg").innerHTML=h; }
function close(){ $("reader").classList.remove("on"); $("panel").classList.remove("on"); $("shelf").style.display=""; loadIndex(); }

/* ===== ページ割り ===== */
function ratio(){ return total>1 ? page/(total-1) : 0; }
function paginate(pos){
  const paper=$("paper"), vp=$("vp"), flow=$("flow");
  const pw=paper.clientWidth, ph=paper.clientHeight; if(!pw||!ph) return;
  const fs=pref.fs, lh=Math.round(fs*2);
  document.documentElement.style.setProperty("--fs",fs+"px");
  document.documentElement.style.setProperty("--lh",lh+"px");
  const padX=Math.max(18,Math.round(pw*.06)), padTop=Math.max(28,Math.round(ph*.05)), padBottom=padTop+16;
  const availW=pw-padX*2, availH=ph-padTop-padBottom;
  const pwv=pref.dir==="v"?availW:Math.min(availW,fs*34), phv=pref.dir==="v"?availH:Math.max(lh,Math.floor(availH/lh)*lh);
  document.documentElement.style.setProperty("--pw",pwv+"px");
  document.documentElement.style.setProperty("--ph",phv+"px");
  if(pref.dir==="v"){
    // 縦書き：段組みで縦方向にページを並べ、上下に送る
    const pageW=availW, pageH=availH, gap=padTop+padBottom;
    Object.assign(vp.style,{width:pageW+"px",height:pageH+"px",left:padX+"px",top:padTop+"px"});
    Object.assign(flow.style,{width:pageW+"px",height:pageH+"px",columnWidth:pageH+"px",columnGap:gap+"px"});
    step=pageH+gap;
    total=Math.max(1,Math.round((flow.scrollHeight+gap)/step));
  }else{
    const pageW=Math.min(availW,fs*34), pageH=Math.max(lh,Math.floor(availH/lh)*lh), gap=padX*2;
    Object.assign(vp.style,{width:pageW+"px",height:pageH+"px",left:Math.round((pw-pageW)/2)+"px",top:padTop+"px"});
    Object.assign(flow.style,{width:pageW+"px",height:pageH+"px",columnWidth:pageW+"px",columnGap:gap+"px"});
    step=pageW+gap;
    total=Math.max(1,Math.round((flow.scrollWidth+gap)/step));
  }
  page=Math.min(total-1,Math.max(0,Math.round((pos||0)*(total-1))));
  show();
}
function show(dir){
  if(dir){ const vp=$("vp"); vp.classList.remove("turn-next","turn-prev"); void vp.offsetWidth; vp.classList.add(dir>0?"turn-next":"turn-prev"); }
  $("flow").style.transform = pref.dir==="v" ? `translateY(${-page*step}px)` : `translateX(${-page*step}px)`;
  const label=`${page+1} / ${total}`;
  $("prog").textContent=label; $("folio").textContent=label;
  $("slider").max=total-1; $("slider").value=page;
  if(cur>=0&&index[cur]){ pref.mark={id:index[cur].id,pos:ratio()}; savePref(); }
}
function go(d){
  const n=page+d;
  if(n>=0&&n<total){ page=n; show(d); $("reader").classList.add("hide-ui"); return; }
  if(d>0&&cur<index.length-1) open(cur+1,0);
  else if(d<0&&cur>0) open(cur-1,1);
}
// 縦書きは左が「次」、横書きは右が「次」
// 最後のページの「次の話へ／目次へ」ボタンを押せるように
function hitEnd(e){ const b=[...document.querySelectorAll(".end button")].find(el=>{const r=el.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;}); if(b){b.click();return true;} return false; }
function side(s,e){ if(swiped){swiped=false;return;} if(hitEnd(e)) return; go((pref.dir==="v")===(s==="left")?1:-1); }
$("tapL").onclick=e=>side("left",e);
$("tapR").onclick=e=>side("right",e);
$("tapM").onclick=e=>{ if(swiped){swiped=false;return;} if(hitEnd(e)) return; $("reader").classList.toggle("hide-ui"); $("panel").classList.remove("on"); };
$("slider").oninput=e=>{ page=+e.target.value; show(); };

// スワイプ
let sx=null, sy=null;
$("reader").addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
$("reader").addEventListener("touchend",e=>{
  if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)&&!e.target.closest(".bar,.panel")){
    swiped=true; setTimeout(()=>swiped=false,400);
    go(pref.dir==="v" ? (dx>0?1:-1) : (dx<0?1:-1));
  }
});
document.addEventListener("keydown",e=>{
  if(!$("reader").classList.contains("on")) return;
  const v=pref.dir==="v";
  if(e.key==="ArrowLeft"){e.preventDefault();go(v?1:-1)}
  if(e.key==="ArrowRight"){e.preventDefault();go(v?-1:1)}
  if(e.key===" "){e.preventDefault();go(e.shiftKey?-1:1)}
  if(e.key==="Escape") close();
});

/* ===== 設定 ===== */
function applyPref(){
  const r=ratio();
  $("reader").classList.toggle("v",pref.dir==="v"); $("reader").classList.toggle("h",pref.dir==="h");
  document.querySelectorAll("#segDir button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===pref.dir));
  document.querySelectorAll("#segFs button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===+pref.fs));
  if($("reader").classList.contains("on")) paginate(r);
}
$("segDir").onclick=e=>{const b=e.target.closest("button"); if(b){pref.dir=b.dataset.v; savePref(); applyPref();}};
$("segFs").onclick=e=>{const b=e.target.closest("button"); if(b){pref.fs=+b.dataset.v; savePref(); applyPref();}};
$("setBtn").onclick=()=>$("panel").classList.toggle("on");
$("panelClose").onclick=()=>$("panel").classList.remove("on");
$("closeBtn").onclick=close;
$("list").onclick=e=>{const b=e.target.closest("[data-i]"); if(b) open(+b.dataset.i);};
let rT; window.addEventListener("resize",()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if($("reader").classList.contains("on")) paginate(ratio()); },150); });

applyPref(); loadIndex();
</script>
</body>
</html>
