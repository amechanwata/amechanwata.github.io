<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="『光の届かぬ庭で、ティータイムを』IF COLLECTION――もし、二人が違う世界で出会っていたら。">
<title>IF COLLECTION | 光の届かぬ庭で、ティータイムを</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
/* 本編の夜から、いくつもの世界へ。このページは夜色で固定 */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --night:#15121B; --night2:#1E1A25; --ink:#ECE6F0; --soft:#A79FB3; --lav:#C9B8EA; --line:rgba(201,184,234,.2);
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --latin:"Cormorant Garamond","Shippori Mincho",serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{margin:0;background:var(--night);color:var(--ink);font-family:var(--serif);line-height:1.95;letter-spacing:.04em;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lav);outline-offset:3px}

/* ヘッダー */
.hdr{position:fixed;left:0;right:0;top:0;z-index:10;padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;justify-content:space-between;height:calc(52px + env(safe-area-inset-top,0px))}
.hdr::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(21,18,27,.9),rgba(21,18,27,0));pointer-events:none}
.hdr .t{font-size:12px;line-height:1.45;letter-spacing:.08em;text-decoration:none;opacity:.85}
@media (min-width:600px){.hdr .t{font-size:13px}.hdr .t br{display:none}}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.menu summary::-webkit-details-marker{display:none}
.menu summary svg{width:22px;height:22px}
.menu .sheet{position:absolute;right:0;top:48px;min-width:210px;padding:8px;border-radius:4px;background:#221F27;border:1px solid rgba(169,155,194,.35);box-shadow:0 16px 40px -12px rgba(0,0,0,.6);display:flex;flex-direction:column}
.menu .sheet a{display:flex;align-items:center;min-height:46px;padding:0 14px;text-decoration:none;font-size:15px;letter-spacing:.14em;border-radius:3px}
.menu .sheet a[aria-current]{background:rgba(169,155,194,.2)}

/* ---------- 冒頭：本編のふたり ---------- */
.hero{position:relative;min-height:88vh;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero img.kv{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.hero img.kv{object-fit:cover;object-position:50% 30%;opacity:.85;filter:saturate(.85)}
@media (min-width:820px){
  .hero img.kv{left:auto;right:0;width:min(58%,720px);object-position:50% 40%;opacity:.95;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 30%);mask-image:linear-gradient(to right,transparent 0,#000 30%)}
  .hero-in{padding-bottom:80px}
}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,rgba(21,18,27,.6) 0%,rgba(21,18,27,.1) 40%,rgba(21,18,27,.75) 78%,var(--night) 100%)}
.hero-in{width:100%;max-width:1080px;margin:0 auto;padding:0 24px 54px}
.hero .kicker{font-family:var(--latin);font-size:clamp(.95rem,3.4vw,1.1rem);letter-spacing:.5em;color:var(--lav);margin:0}
.hero h1{margin:.1em 0 0;font-family:var(--latin);font-weight:500;font-size:clamp(2.6rem,11vw,5rem);letter-spacing:.08em;line-height:1.05}
.hero .lead{margin:1.1em 0 0;font-size:clamp(.95rem,3.6vw,1.15rem);letter-spacing:.14em}
.hero .vow{margin:2em 0 0;padding-left:1.1em;border-left:1px solid rgba(201,184,234,.5)}
.hero .vow em{display:block;font-family:var(--latin);font-style:italic;font-size:clamp(1.25rem,4.8vw,1.7rem);letter-spacing:.06em;line-height:1.4}
.hero .vow span{display:block;margin-top:.3em;font-size:.88rem;color:var(--soft);letter-spacing:.2em}
.fade{opacity:0;transform:translateY(8px);animation:rise 1.6s ease forwards}
.fade.d2{animation-delay:.5s}.fade.d3{animation-delay:1s}.fade.d4{animation-delay:1.6s}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1;transform:none}}

/* ---------- 世界の一覧：一本の糸でつながる旅 ---------- */
main{max-width:1080px;margin:0 auto;padding:30px 18px 40px}
.intro{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 4px 30px}
.intro h2{margin:0;font-family:var(--latin);font-weight:500;font-size:1.4rem;letter-spacing:.3em}
.prog{font-size:.8rem;color:var(--soft);letter-spacing:.14em;display:flex;align-items:center;gap:8px}
.dots{display:inline-flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--lav);display:block}
.dots i.on{background:var(--lav)}
/* 糸 */
.path{position:relative;padding-left:30px}
@media (min-width:820px){.path{padding-left:48px}}
.path::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,rgba(201,184,234,.6),rgba(201,184,234,.15) 85%,rgba(255,243,222,.7))}
@media (min-width:820px){.path::before{left:16px}}
.stop{position:relative;margin:0 0 clamp(54px,9vw,96px)}
.stop::before{content:"";position:absolute;left:-26px;top:10px;width:9px;height:9px;border-radius:50%;border:1px solid var(--lav);background:var(--night)}
@media (min-width:820px){.stop::before{left:-36px}}
.stop.seen::before{background:var(--lav);box-shadow:0 0 10px rgba(201,184,234,.7)}

/* 共通：世界の札 */
.w{display:block;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer;color:inherit}
.panel{position:relative;overflow:hidden;border-radius:3px;isolation:isolate;background:var(--night2);transition:transform .5s ease}
.panel .bg{position:absolute;inset:0;z-index:-2;background:radial-gradient(120% 90% at 72% 18%,var(--acc) 0%,transparent 62%),linear-gradient(160deg,var(--acc2),var(--night2) 72%);opacity:.6;transition:opacity .5s}
.panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.panel::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(21,18,27,.85),transparent 60%)}
.w:hover .panel{transform:scale(1.01)}
.w:hover .panel .bg{opacity:.85}
.num{position:absolute;font-family:var(--latin);font-weight:500;line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(236,230,240,.35);pointer-events:none}
.ttl{font-family:var(--latin);font-weight:500;letter-spacing:.14em;line-height:1.1;margin:0}
.lbl{font-family:var(--latin);font-size:.78rem;letter-spacing:.32em;color:var(--lav)}
.sub{font-size:.8rem;color:#D8D0E2;letter-spacing:.1em}
.quote{margin:.9em 0 0;font-size:clamp(.95rem,3.4vw,1.08rem);line-height:1.9;letter-spacing:.06em}
.visited{display:inline-block;margin-left:.8em;font-size:.62rem;letter-spacing:.16em;padding:0 7px;border:1px solid rgba(201,184,234,.5);border-radius:999px;color:var(--lav);vertical-align:.3em}
.enter{display:inline-flex;align-items:center;gap:.6em;margin-top:1em;font-family:var(--latin);font-size:.8rem;letter-spacing:.3em;color:var(--lav)}
.enter::after{content:"";width:28px;height:1px;background:currentColor;transition:width .3s}
.w:hover .enter::after{width:48px}

/* 型1：大きく（feature） */
.feature .panel{aspect-ratio:16/10;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 20px}
@media (min-width:820px){.feature .panel{aspect-ratio:21/9;padding:30px 34px}}
.feature .num{right:-.05em;top:-.12em;font-size:clamp(7rem,30vw,15rem)}
.feature .ttl{font-size:clamp(2rem,8.6vw,3.6rem)}
.feature.rev .panel{align-items:flex-end;text-align:right}
.feature.rev .num{right:auto;left:-.05em}

/* 型2：ふたつ並び（duo） */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (min-width:820px){.duo{gap:26px}}
.duo .w:nth-child(2){margin-top:clamp(28px,8vw,70px)}
.duo .panel{aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.duo .num{right:6px;top:2px;font-size:clamp(4rem,16vw,7rem)}
.duo .ttl{font-size:clamp(1.15rem,4.6vw,1.8rem)}
.duo .quote{font-size:.86rem}

/* 型3：文字だけ（quiet） */
.quiet .w{padding:clamp(20px,6vw,40px) 0}
.quiet .ttl{font-size:clamp(2.2rem,10vw,4.6rem);letter-spacing:.3em;color:#F3EEF6}
.quiet .quote{font-family:var(--serif);font-size:clamp(1rem,3.8vw,1.25rem);color:#D8D0E2;margin-top:1.2em}
.quiet .sub{display:block;margin-top:.6em}

/* 型4：細く高く、中央に（center） */
.center .w{max-width:420px;margin:0 auto;text-align:center}
.center .panel{aspect-ratio:3/4.4;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:22px}
.center .num{left:50%;transform:translateX(-50%);top:-.1em;font-size:clamp(6rem,24vw,10rem)}
.center .ttl{font-size:clamp(1.8rem,7vw,2.8rem);letter-spacing:.3em}
.center .quote{text-align:center;font-size:clamp(1.05rem,4vw,1.3rem)}

/* 型5：最後の扉 */
.door .panel{aspect-ratio:16/11;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;border:1px solid rgba(255,243,222,.18);background:#0F0D13}
@media (min-width:820px){.door .panel{aspect-ratio:21/8}}
.door .bg{opacity:.18;filter:blur(8px)}
.door .ttl{font-size:clamp(1.6rem,6vw,2.4rem);letter-spacing:.5em;color:var(--soft);margin-top:.5em}
.door .sub{color:var(--soft);margin-top:.8em}
.door .lock{width:38px;height:38px;opacity:.75}
.door.open .panel{border-color:rgba(255,243,222,.6);box-shadow:0 0 50px -10px rgba(255,243,222,.45)}
.door.open .bg{opacity:.7;filter:none}
.door.open .ttl{color:#FFF6E8}
.door.pop .panel{animation:glow 2.6s ease}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,247,232,.95)}100%{box-shadow:0 0 50px -10px rgba(255,243,222,.45)}}
@media (prefers-reduced-motion:reduce){.panel,.panel .bg,.enter::after{transition:none}.door.pop .panel{animation:none}}

/* ---------- 世界のページ（全画面） ---------- */
.world{position:fixed;inset:0;z-index:30;display:none;background:var(--night);overflow-y:auto;-webkit-overflow-scrolling:touch}
.world.on{display:block}
.w-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;height:calc(52px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0 18px;background:linear-gradient(var(--night),rgba(21,18,27,.85))}
.w-bar .no{font-family:var(--latin);letter-spacing:.3em;color:var(--lav);font-size:.85rem}
.w-bar .nm{flex:1;font-family:var(--latin);letter-spacing:.2em;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-x{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.05);font-size:19px;cursor:pointer}
.w-in{max-width:760px;margin:0 auto;padding:6px 20px calc(40px + env(safe-area-inset-bottom,0px))}
.kvbox{position:relative;margin:0 -20px;aspect-ratio:3/2;overflow:hidden;background:radial-gradient(120% 90% at 70% 20%,var(--acc) 0%,transparent 60%),linear-gradient(160deg,var(--acc2),var(--night) 75%)}
@media (min-width:800px){.kvbox{margin:0;border-radius:4px}}
.kvbox img{width:100%;height:100%;object-fit:cover}
.kvbox .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;text-align:center}
.kvbox .ph b{font-family:var(--latin);font-weight:500;font-size:clamp(2rem,9vw,3.4rem);letter-spacing:.2em}
.kvbox .ph span{font-size:.75rem;color:var(--soft);letter-spacing:.2em}
.catch{margin:1.6em 0 0;font-size:clamp(1.15rem,4.4vw,1.45rem);letter-spacing:.1em;line-height:1.8}
.cast{margin:.8em 0 0;font-size:.85rem;color:var(--lav);letter-spacing:.14em}
.syn{margin:1.2em 0 0;color:#D8D0E2;line-height:2.1}
.sec{margin:2.6em 0 0}
.sec h4{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-family:var(--latin);font-weight:500;font-size:.95rem;letter-spacing:.35em;color:var(--lav)}
.sec h4::after{content:"";flex:1;height:1px;background:var(--line)}
.manga img{width:100%;border-radius:3px}
.empty{padding:34px 18px;text-align:center;border:1px dashed var(--line);border-radius:4px;color:var(--soft);font-size:.85rem;line-height:1.9}
.ss p{margin:0 0 1.1em;text-indent:1em;line-height:2.2;font-size:.98rem}
.ss p.talk{text-indent:0}
.w-nav{display:flex;justify-content:space-between;gap:10px;margin:3em 0 0;padding-top:1.4em;border-top:1px solid var(--line)}
.w-nav button{flex:1;min-height:48px;padding:6px 12px;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;font-size:.85rem;letter-spacing:.1em}
.w-nav button small{display:block;font-family:var(--latin);font-size:.72rem;letter-spacing:.24em;color:var(--soft)}
.w-nav button:disabled{opacity:.25;cursor:default}
/* 最後の世界だけ、言葉を最小限に */
.world.final .catch{text-align:center;font-size:clamp(1.05rem,4vw,1.3rem);margin-top:2.2em;color:#F3EEF6}
.world.final .cast,.world.final .syn{display:none}

.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:40;padding:12px 20px;border:1px solid rgba(255,247,232,.4);border-radius:999px;background:rgba(30,27,36,.95);font-size:.88rem;letter-spacing:.12em;opacity:0;transition:.5s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{max-width:1080px;margin:0 auto;padding:30px 24px calc(56px + env(safe-area-inset-bottom,0px));font-size:.78rem;color:var(--soft)}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:1em;font-size:.86rem;letter-spacing:.12em}
.foot nav a{text-decoration:none}
</style>
</head>

  const style=`--acc:${w.acc};--acc2:${w.acc2}`, nn=String(i+1).padStart(2,"0"), v=seen.has(i)?'<span class="visited">VISITED</span>':"";
  const head=`<span class="lbl">${no(i)}</span>${v}`;
  if(/quiet/.test(lay(i))) return `<button class="w" data-i="${i}" style="${style}">${head}<p class="ttl">${esc(w.code)}</p><span class="sub">${esc(w.sub)}</span><p class="quote">${esc(w.catch)}</p><span class="enter">ENTER</span></button>`;
  return `<button class="w" data-i="${i}" style="${style}" aria-label="${no(i)} ${esc(w.code)}をひらく">
    <div class="panel"><span class="bg"></span>${src(w,"thumb")?`<img src="${src(w,"thumb")}" alt="" loading="lazy">`:""}<span class="num">${nn}</span>
      <div>${head}<p class="ttl">${esc(w.code)}</p><span class="sub">${esc(w.sub)}</span></div></div>
    <p class="quote">${esc(w.catch)}</p><span class="enter">ENTER</span></button>`;
}
function renderList(pop){
  const open=unlocked(), out=[]; let i=0;
  while(i<WORLDS.length){
    const w=WORLDS[i];
    if(w.final){
      const style=`--acc:${w.acc};--acc2:${w.acc2}`;
      out.push(open
        ? `<div class="stop door open${pop?" pop":""}"><button class="w" data-i="${i}" style="${style}" aria-label="最後の世界をひらく"><div class="panel"><span class="bg"></span>${src(w,"thumb")?`<img src="${src(w,"thumb")}" alt="" loading="lazy">`:""}<span class="lbl">${no(i)}</span><p class="ttl">NOTHING HAPPENED</p><span class="sub">${esc(w.openSub)}</span></div></button></div>`
        : `<div class="stop door"><div class="w" style="${style};cursor:default" aria-label="${no(i)}　鍵がかかっています"><div class="panel"><span class="bg"></span>${LOCK}<p class="ttl">???</p><span class="sub">${esc(w.sub)}</span></div></div></div>`);
      i++; continue;
    }
    if(/duo/.test(lay(i)) && WORLDS[i+1] && !WORLDS[i+1].final && /duo/.test(lay(i+1))){
      out.push(`<div class="stop duo${seen.has(i)||seen.has(i+1)?" seen":""}">${card(w,i)}${card(WORLDS[i+1],i+1)}</div>`); i+=2; continue;
    }
    const L = /duo/.test(lay(i)) ? "center" : lay(i);   // 相方のいない「ふたつ並び」は、中央の1枚に
    out.push(`<div class="stop ${L}${seen.has(i)?" seen":""}">${card(w,i)}</div>`); i++;
  }
  $("worlds").innerHTML=out.join("");
  const n=[...Array(N).keys()].filter(k=>seen.has(k)).length;
  $("prog").innerHTML=`<span class="dots">${[...Array(N).keys()].map(k=>`<i class="${seen.has(k)?"on":""}"></i>`).join("")}</span>${n} / ${N}`;
}
$("worlds").addEventListener("click",e=>{ const b=e.target.closest("button.w"); if(b) openW(+b.dataset.i); });

function ssHTML(t){ return t.trim().split(/\n\s*\n/).map(p=>`<p${/^[「『]/.test(p.trim())?' class="talk"':''}>${esc(p.trim()).replace(/\n/g,"<br>")}</p>`).join(""); }
function openW(i){
  const w=WORLDS[i]; if(!w || (w.final && !unlocked())) return;
  if(!$("world").classList.contains("on")) lastFocus=document.activeElement;
  cur=i; $("world").style.setProperty("--acc",w.acc); $("world").style.setProperty("--acc2",w.acc2);
  $("world").classList.toggle("final",!!w.final);
  $("wNo").textContent=no(i); $("wName").textContent=w.final?"":w.code;
  const prev=i>0?WORLDS[i-1]:null, next=i<N-1?WORLDS[i+1]:(i===N-1&&unlocked()?WORLDS[N]:null);
  $("wBody").innerHTML=`
    <div class="kvbox">${src(w,"kv")?`<img src="${src(w,"kv")}" alt="${esc(w.final?"何も起こらなかった世界の、朝のふたり":w.code+"の世界のふたり")}">`:`<div class="ph"><b>${w.final?"&nbsp;":esc(w.code)}</b><span>キービジュアル準備中</span></div>`}</div>
    <p class="catch">${esc(w.catch)}</p>
    <p class="cast">${esc(w.cast)}</p>
    <p class="syn">${esc(w.syn)}</p>
    ${w.final&&!w.manga&&!w.ss?"":`
    <div class="sec manga"><h4>MANGA</h4>${src(w,"manga")?`<img src="${src(w,"manga")}" alt="${esc(w.code)}の漫画" loading="lazy">`:`<div class="empty">4コマ／1ページ漫画は準備中です</div>`}</div>
    <div class="sec ss"><h4>SHORT STORY</h4>${w.ss?ssHTML(w.ss):`<div class="empty">ショートストーリーは準備中です</div>`}</div>`}
    <div class="w-nav">
      <button id="wPrev" ${prev?"":"disabled"}><small>PREV</small>${prev?esc(prev.final?"???":prev.code):"―"}</button>
      <button id="wNext" ${next?"":"disabled"}><small>NEXT</small>${next?esc(next.final?"最後の世界":next.code):"―"}</button>
    </div>`;
  $("wPrev").onclick=()=>openW(i-1); $("wNext").onclick=()=>openW(i+1);
  $("world").scrollTop=0; $("world").classList.add("on"); document.body.style.overflow="hidden";
  history.replaceState(null,"","#if"+String(i+1).padStart(2,"0"));
  const was=unlocked();
  if(!w.final){ seen.add(i); try{localStorage.setItem(KEY,JSON.stringify([...seen]))}catch(e){} }
  if(!was && unlocked()){ justOpened=true; }
  $("wClose").focus({preventScroll:true});
}
let justOpened=false;
function closeW(){
  $("world").classList.remove("on"); document.body.style.overflow="";
  history.replaceState(null,"",location.pathname+location.search);
  renderList(justOpened);
  if(justOpened){ toast("最後の世界の扉が、ひらきました"); justOpened=false; }
  if(lastFocus&&document.body.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),3200); }
$("wClose").onclick=closeW;
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("world").classList.contains("on")) closeW(); });
document.addEventListener("click",e=>{document.querySelectorAll("details.menu[open]").forEach(d=>{if(!d.contains(e.target))d.removeAttribute("open")})});

function boot(){ N=WORLDS.length-1; renderList(false); const m=location.hash.match(/^#if(\d+)$/); if(m) openW(+m[1]-1); }
// 書斎の「IF」タブで保存した中身があれば、そちらを使う
fetch(`if/index.json?t=${Date.now()}`).then(r=>r.ok?r.json():null).then(d=>{
  if(d && Array.isArray(d.worlds) && d.worlds.length){
    const fin=d.worlds.find(w=>w.final), rest=d.worlds.filter(w=>!w.final);
    WORLDS = fin ? rest.concat(fin) : rest;
  }
}).catch(()=>{}).finally(boot);
</script>
</body>
</html>
